name: Verify Ninochka expense inbox

on:
  push:
    branches: ["feature/charlie-expense-inbox-20261015"]
  pull_request:
    branches: ["main"]
    paths:
      - "v4/app-inbox.js"
      - "sync-service/api/inbox.js"
      - "tests-inbox.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/inbox-check.yml"

permissions:
  contents: read

jobs:
  verify-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static JavaScript verification
        run: |
          node --check sync-service/api/inbox.js
          node --check v4/app-inbox.js
          cat v4/app-00.js v4/app-01.js v4/app-02.js v4/app-03.js v4/app-04.js v4/app-05.js v4/app-contract.js v4/app-sync.js v4/app-inbox.js > app.js
          node --check app.js
      - name: Budget invariants and UI smoke tests
        run: |
          node tests-inbox.mjs
          node tests-v4.mjs
          mkdir -p _site
          cp index.html contract.css core.js corefix.js sync-config.js app.js _site/
          cp -r assets _site/
          node tests-ui-contract.mjs _site
          node tests-ui-runtime.mjs _site
