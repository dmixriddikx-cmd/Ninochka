name: Deploy Ninochka V4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify V4
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css core.js corefix.js _site/
          cat v4/app-00.js v4/app-01.js v4/app-02.js v4/app-03.js v4/app-04.js v4/app-05.js > _site/app.js
          touch _site/.nojekyll

          node --check _site/app.js
          node --check _site/core.js
          node --check _site/corefix.js
          node tests-v4.mjs
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/core.js
          test -s _site/corefix.js
          test -s _site/app.js
          grep -q 'notranslate' _site/index.html
          grep -q 'ninochka-v4' _site/app.js
          grep -q "corefix.js" _site/app.js
          grep -q "closed-week" _site/app.js
          echo "Ninochka V4 build verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
