name: Deploy Ninochka V4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned backend dependencies
        run: npm ci --prefix sync-service --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify V4
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          BUILD_ID="$(git rev-parse --short HEAD)"
          sed "s/__BUILD_ID__/${BUILD_ID}/g" index.html > _site/index.html
          sed "s/__BUILD_ID__/${BUILD_ID}/g" sw.js > _site/sw.js
          cp contract.css core.js corefix.js sync-config.js _site/
          cp -r assets/* _site/assets/
          cp manifest.webmanifest _site/
          python -m pip install --disable-pip-version-check --quiet 'CairoSVG==2.8.2'
          python scripts/build-vnn-icons.py _site
          cat v4/app-00.js v4/app-01.js v4/app-02.js v4/app-03.js v4/app-04.js v4/app-05.js v4/app-contract.js v4/app-sync.js v4/app-inbox.js v4/app-quick.js v4/app-scan.js > _site/app.js
          touch _site/.nojekyll

          node --check _site/app.js
          node --check _site/core.js
          node --check _site/corefix.js
          node tests-v4.mjs
          node tests-inbox.mjs
          node tests-inbox-dedupe.mjs
          node tests-inbox-validation.mjs
          node tests-inbox-race.mjs
          node tests-scan-batch.mjs
          node tests-importer.mjs
          node tests-transaction-status.mjs
          node tests-recognition.mjs
          node tests-auth.mjs
          npm test --prefix sync-service
          node tests-sync-browser.mjs
          node --check sync-service/lib/token-auth.js
          node --experimental-test-module-mocks tests-api-recognition.mjs
          node --test sync-service/quick-entry.test.mjs
          node tests-ui-contract.mjs _site
          node tests-ui-runtime.mjs _site

          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/assets/vnn-icon-180.png
          test -s _site/assets/vnn-icon-192.png
          test -s _site/assets/vnn-icon-512.png
          grep -q 'rel="apple-touch-icon"' _site/index.html
          grep -q 'rel="manifest"' _site/index.html
          test -s _site/contract.css
          test -s _site/app.js
          test -s _site/assets/storage-approved.b64
          test -s _site/assets/week-empty-approved.b64
          base64 -d _site/assets/storage-approved.b64 > /tmp/storage-approved.webp
          base64 -d _site/assets/week-empty-approved.b64 > /tmp/week-empty-approved.webp
          file /tmp/storage-approved.webp | grep -qi 'Web/P image'
          file /tmp/week-empty-approved.webp | grep -qi 'Web/P image'
          grep -q 'contract.css?v=' _site/index.html
          test "$(grep -c 'stylesheet' _site/index.html)" -eq 1
          ! grep -Eq 'styles\.css|final-theme\.css|final-approved|week-polish' _site/index.html
          grep -q 'FINAL UI CONTRACT' _site/app.js
          grep -q 'ct-storage-art' _site/app.js
          grep -q 'ct-plan-page' _site/app.js
          grep -q 'ct-more-page' _site/app.js
          grep -q 'ct-home-hero' _site/contract.css
          grep -q 'ct-storage-hero' _site/contract.css
          echo "Ninochka FINAL UI CONTRACT build verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
