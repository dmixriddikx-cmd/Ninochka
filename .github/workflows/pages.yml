name: Deploy Ninochka V4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify V4
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html styles.css week-polish.css final-theme.css final-approved.css final-approved-2.css contract.css core.js corefix.js _site/
          cp -r assets/* _site/assets/
          cat v4/app-00.js v4/app-01.js v4/app-02.js v4/app-03.js v4/app-04.js v4/app-05.js v4/app-final.js v4/app-atlas.js v4/app-approved.js v4/app-assets.js v4/app-approved-2.js v4/app-contract.js > _site/app.js
          touch _site/.nojekyll

          node --check _site/app.js
          node --check _site/core.js
          node --check _site/corefix.js
          node tests-v4.mjs

          test -s _site/index.html
          test -s _site/contract.css
          test -s _site/app.js
          test -s _site/assets/storage-approved.b64
          test -s _site/assets/week-empty-approved.b64
          base64 -d _site/assets/storage-approved.b64 > /tmp/storage-approved.webp
          base64 -d _site/assets/week-empty-approved.b64 > /tmp/week-empty-approved.webp
          file /tmp/storage-approved.webp | grep -qi 'Web/P image'
          file /tmp/week-empty-approved.webp | grep -qi 'Web/P image'
          grep -q 'contract.css' _site/index.html
          grep -q 'FINAL UI CONTRACT' _site/app.js
          grep -q 'ct-storage-art' _site/app.js
          grep -q 'ct-plan-page' _site/app.js
          grep -q 'ct-more-page' _site/app.js
          grep -q 'ct-home-hero' _site/contract.css
          grep -q 'ct-storage-hero' _site/contract.css
          echo "Ninochka FINAL UI CONTRACT build verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
