name: Deploy Ninochka V4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify V4
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html styles.css week-polish.css final-theme.css core.js corefix.js _site/
          cp -r assets/* _site/assets/
          cat v4/app-00.js v4/app-01.js v4/app-02.js v4/app-03.js v4/app-04.js v4/app-05.js v4/app-final.js v4/app-atlas.js > _site/app.js
          touch _site/.nojekyll

          node --check _site/app.js
          node --check _site/core.js
          node --check _site/corefix.js
          node tests-v4.mjs

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/week-polish.css
          test -s _site/final-theme.css
          test -s _site/core.js
          test -s _site/corefix.js
          test -s _site/app.js
          test -s _site/assets/storage-guards.svg
          for i in 0 1 2 3; do test -s "_site/assets/ref-atlas-$i.txt"; done
          cat _site/assets/ref-atlas-{0,1,2,3}.txt | tr -d '\n\r ' | base64 -d > /tmp/ref-atlas.webp
          test -s /tmp/ref-atlas.webp
          file /tmp/ref-atlas.webp | grep -qi 'Web/P image'

          grep -q 'notranslate' _site/index.html
          grep -q 'final-theme.css' _site/index.html
          grep -q 'ninochka-v4' _site/app.js
          grep -q "corefix.js" _site/app.js
          grep -q "fx-nav" _site/app.js
          grep -q "ref-atlas" _site/app.js
          grep -q "data-week-step" _site/app.js
          echo "Ninochka exact-reference build verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
