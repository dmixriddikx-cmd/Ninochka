<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>VNN — безопасное обновление Safari</title>
<style>
:root{color-scheme:dark;--bg:#12141a;--card:#1f222b;--text:#f2ecf4;--muted:#bbb5c4;--accent:#9384cf}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
main{max-width:440px;width:100%;border:1px solid #3e384d;border-radius:28px;background:var(--card);padding:25px 22px;box-shadow:0 20px 60px #0005}
mark{display:block;background:none;color:var(--accent);font-family:Georgia,serif;font-size:42px;line-height:1.1}
h1{font-size:24px;line-height:1.2;margin:18px 0 8px}
p{margin:9px 0;color:var(--muted)}
small{color:var(--muted)}
button,a.go{display:block;width:100%;font:700 16px -apple-system,system-ui,sans-serif;text-align:center;border-radius:16px;min-height:54px;padding:13px 12px;text-decoration:none}
button{background:var(--accent);border:0;color:#13101b;margin-top:22px}
button:disabled{opacity:.6}
a.go{color:var(--text);border:1px solid #4d4657;margin-top:12px}
#status{min-height:50px;margin-top:15px;font-size:14px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:start;background:#3d2833;border:1px solid #9b5e7c;padding:12px;border-radius:14px;font-size:13px;margin-top:16px}
.check input{margin-top:4px;min-width:18px;min-height:18px;accent-color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<mark>VNN ♡</mark>
<h1>Обновление для Safari</h1>
<p>Проверяем актуальную версию и обновляем файлы интерфейса без очистки Safari.</p>
<p><small>Баланс, история операций, сохранённый вход и данные в <b>localStorage</b> не удаляются.</small></p>
<label class="check" id="dirty-warning" hidden><input id="backup-confirm" type="checkbox"><span>В Safari есть ожидающие отправки изменения. Я заранее сохранил(а) локальную копию через «Ещё → Скачать копию» и хочу обновить интерфейс.</span></label>
<button id="refresh" type="button">Обновить VNN</button>
<p id="status" role="status" aria-live="polite"></p>
<a href="./" class="go">Вернуться без обновления</a>
</main>
<script>
(() => {
  'use strict';
  const button=document.getElementById('refresh');
  const status=document.getElementById('status');
  const warning=document.getElementById('dirty-warning');
  const checkbox=document.getElementById('backup-confirm');
  const scope=new URL('./',location.href).href;
  // Never clear localStorage, sessionStorage, IndexedDB, cookies or family data.
  let pending=false;
  try{pending=localStorage.getItem('ninochka-sync-dirty')==='1'}catch{}
  warning.hidden=!pending;
  const updateReady=()=>{button.disabled=pending&&!checkbox.checked};
  checkbox.addEventListener('change',updateReady);updateReady();
  button.addEventListener('click',async()=>{
    if(pending&&!checkbox.checked)return;
    button.disabled=true;
    status.textContent='Проверяю доступность новой версии…';
    try{
      const request=new URL('./version.json',location.href);
      request.searchParams.set('check',String(Date.now()));
      const response=await fetch(request.href,{cache:'no-store',credentials:'same-origin'});
      if(!response.ok)throw new Error('Версия ещё недоступна ('+response.status+').');
      const {build}=await response.json();
      if(!/^[a-f0-9]{7,40}$/.test(build))throw new Error('Номер версии недоступен. Повтори позже.');
      status.textContent='Версия '+build+' найдена. Обновляю интерфейс…';
      if('serviceWorker' in navigator) {
        const registration=await navigator.serviceWorker.getRegistration(scope);
        if(registration)await registration.update();
      }
      status.textContent='Готово. Открываю VNN…';
      const next=new URL('./',location.href);
      next.searchParams.set('vnn_release',build);
      next.searchParams.set('t',String(Date.now()));
      location.replace(next.href);
    }catch(error){
      status.textContent='Не удалось обновить: '+(error?.message||String(error))+'. Локальные данные не затронуты.';
      updateReady();
    }
  });
})();
</script>
</body>
</html>
