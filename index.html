<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><title>Ninochka</title><style>html,body{margin:0;min-height:100%;background:#f8f5ef;color:#37322d;font-family:system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{font:600 46px Georgia,serif}.boot span{display:block;margin-top:8px;opacity:.65}</style></head><body><div class="boot"><div><b>Nina</b><span>Семейные финансы · загрузка…</span></div></div><script>(async()=>{try{const ps=['payload/part-00.txt', 'payload/part-01.txt', 'payload/part-02.txt', 'payload/part-03.txt', 'payload/part-04.txt', 'payload/part-05.txt', 'payload/part-06.txt', 'payload/part-07.txt', 'payload/part-08.txt', 'payload/part-09.txt', 'payload/part-10.txt'];const t=(await Promise.all(ps.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p);return r.text()}))).join('');const b=atob(t);const u=Uint8Array.from(b,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>Nina</b><span>Не удалось загрузить. Обнови страницу.</span></div></div>';console.error(e)}})();</script></body></html>
